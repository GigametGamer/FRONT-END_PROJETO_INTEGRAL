<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela de Login</title>
    <link rel="stylesheet" href="../pages-style.css">
</head>
<body>
    <header>
        <div class="login-container">
            <h1>Login</h1>
        </div>
    </header>
    <main>
        <div class="dados-container">
            <form action="/login" method="POST">
                <div class="email-container">
                <label for="email" class="email-label">Email:</label>
                    <input type="email" id="email" name="email" class="email-input" required>
                </div>
                <div class="password-container">
                    <label for="password" class="password-label ">Senha:</label>
                    <input type="password" id="password" name="password" class="password-input" required>
                </div>
                <button type="submit" class="">Entrar</button>
            </form>
        </div>
    </main>
</body>
</html>
